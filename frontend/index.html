<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>First Pass</title>
<style>
  body {
    font-family: "Helvetica Neue", Arial, sans-serif;
    max-width: 640px;
    margin: 8vh auto 4rem;
    padding: 0 1.5rem;
    color: #1a1d23;
  }
  h1 { font-size: 1.6rem; margin-bottom: 0.2rem; }
  p.tagline { color: #5b6472; margin-top: 0; }
  .input-row { display: flex; gap: 0.6rem; margin: 2rem 0 1.5rem; }
  input[type=text] {
    flex: 1;
    font-size: 1.1rem;
    padding: 0.7rem 0.9rem;
    border: 2px solid #1a1d23;
    border-radius: 6px;
  }
  button {
    font-size: 1.05rem;
    padding: 0.7rem 1.4rem;
    background: #1f4e8c;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  button:disabled { background: #9aa5b1; cursor: default; }
  ul.progress { list-style: none; padding: 0; }
  ul.progress li {
    padding: 0.4rem 0;
    color: #9aa5b1;
    font-size: 0.95rem;
  }
  ul.progress li.running { color: #1f4e8c; font-weight: 600; }
  ul.progress li.done { color: #1e7a34; }
  ul.progress li.pending { color: #b3261e; }
  ul.progress li.empty { color: #b3261e; }
  #report-frame {
    width: 100%;
    height: 80vh;
    border: 1px solid #d8dce2;
    border-radius: 8px;
    margin-top: 1.5rem;
    display: none;
  }
  #open-report-btn {
    display: none;
    margin-top: 1rem;
    background: white;
    color: #1f4e8c;
    border: 2px solid #1f4e8c;
  }
  #error-box {
    display: none;
    background: #fce8e6;
    color: #b3261e;
    padding: 0.8rem 1rem;
    border-radius: 6px;
    margin-top: 1rem;
  }
</style>
</head>
<body>

<h1>First Pass</h1>
<p class="tagline">Target in. Cited Target Safety Assessment out.</p>
<p class="tagline">Type a drug target. Get the cited safety report a toxicologist spends days assembling.</p>

<div class="input-row">
  <input type="text" id="target-input" placeholder="e.g. GLP-1R, HER2, KRAS" autofocus>
  <button id="submit-btn">Generate</button>
</div>

<ul class="progress" id="progress-list"></ul>
<div id="error-box"></div>
<iframe id="report-frame"></iframe>
<button id="open-report-btn" type="button">Open report in new tab</button>

<script>
const STAGE_LABELS = {
  cache: "Serving pre-computed demo report",
  rate_limit: "Waiting for rate limit",
  target_resolution: "Resolving target to approved drug names",
  evidence_retrieval: "Retrieving FDA label & review evidence",
  genetics_precedent: "Loading genetic/knockout precedent",
  section_graph: "Strands Graph: writing 7 report sections (Strands Swarm for the adversity panel nested inside)",
  evaluations: "Running AgentCore evaluations",
  report_render: "Rendering report",
};

// Shotlist note for /academy-submit (Beat 3, ~10s caption over this progress
// list): "Strands Graph (7 nodes) with a Strands Swarm nested as node 5,
// scored by AgentCore Evaluations."

const input = document.getElementById("target-input");
const button = document.getElementById("submit-btn");
const progressList = document.getElementById("progress-list");
const errorBox = document.getElementById("error-box");
const reportFrame = document.getElementById("report-frame");
const openReportBtn = document.getElementById("open-report-btn");

// The report is rendered into the iframe via `srcdoc`, which traps the
// document -- the print stylesheet in report.html.jinja is unreachable by
// Ctrl+P on the outer page. This button opens the same HTML as a real
// standalone document in a new tab, where the browser's own print dialog
// can see the @media print rules.
let lastReportHtml = "";

function resetUI() {
  progressList.innerHTML = "";
  errorBox.style.display = "none";
  errorBox.textContent = "";
  reportFrame.style.display = "none";
  reportFrame.srcdoc = "";
  openReportBtn.style.display = "none";
  lastReportHtml = "";
}

openReportBtn.addEventListener("click", () => {
  if (!lastReportHtml) return;
  const blob = new Blob([lastReportHtml], { type: "text/html" });
  const url = URL.createObjectURL(blob);
  window.open(url, "_blank");
  setTimeout(() => URL.revokeObjectURL(url), 60000);
});

function ensureRow(stage) {
  let row = document.getElementById("stage-" + stage);
  if (!row) {
    row = document.createElement("li");
    row.id = "stage-" + stage;
    row.textContent = STAGE_LABELS[stage] || stage;
    progressList.appendChild(row);
  }
  return row;
}

function submitTarget() {
  const target = input.value.trim();
  if (!target) return;

  resetUI();
  button.disabled = true;

  // One open connection for the whole run: progress events, then a single
  // terminal event carrying the report HTML (or an error) -- no separate
  // start/poll/fetch requests, so there is no cross-request state to keep
  // in sync (this app can run on a serverless deployment where separate
  // requests may land on different instances).
  const source = new EventSource(`/api/generate?target=${encodeURIComponent(target)}`);
  source.onmessage = (msg) => {
    const evt = JSON.parse(msg.data);

    if (evt.stage === "_report") {
      source.close();
      button.disabled = false;
      reportFrame.srcdoc = evt.html;
      reportFrame.style.display = "block";
      lastReportHtml = evt.html;
      openReportBtn.style.display = "inline-block";
      return;
    }
    if (evt.stage === "_report_error") {
      source.close();
      button.disabled = false;
      errorBox.textContent = "Run failed: " + (evt.detail || "unknown error");
      errorBox.style.display = "block";
      return;
    }

    const row = ensureRow(evt.stage);
    row.className = evt.status;
    const label = STAGE_LABELS[evt.stage] || evt.stage;
    row.textContent = evt.detail ? `${label} — ${evt.detail}` : label;
  };
  source.onerror = () => {
    source.close();
    button.disabled = false;
    if (!errorBox.textContent) {
      errorBox.textContent = "Connection to the server was lost.";
      errorBox.style.display = "block";
    }
  };
}

button.addEventListener("click", submitTarget);
input.addEventListener("keydown", (e) => { if (e.key === "Enter") submitTarget(); });
</script>

</body>
</html>
